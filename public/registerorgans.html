<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Register Organs</title>
        <link rel="stylesheet" href="/css/styles.css" />
    </head>
    <body>
        <h1>Register Organs</h1>
        <div class="container">
            <form id="register-organ-form" action="/registerorgans" method="POST">
                <label for="organ">Organ to Register:</label>
                <select id="organ" name="organ" required>
                    <option value="">Select an organ</option>
                    <option value="kidney">Kidney</option>
                    <option value="liver">Liver</option>
                    <option value="lung">Lung</option>
                    <option value="heart">Heart</option>
                </select>
                

                <button type="submit">Register Organ</button>
            </form>
    </div>
    <script src="/js/main.js"></script>
    </body>
</html>
