<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FindMyDoner | Sign In</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
        .signin-page {
            min-height: calc(100vh - 160px);
            display: grid;
            place-items: center;
            padding: 2rem 1rem;
        }

        .signin-card {
            width: min(100%, 760px);
            padding: 2rem;
            border-radius: 24px;
            border: 1px solid #d9f2ec;
            background:
                radial-gradient(circle at 12% 10%, rgba(15, 118, 110, 0.14), transparent 30%),
                radial-gradient(circle at 88% 82%, rgba(45, 212, 191, 0.12), transparent 28%),
                linear-gradient(160deg, #ffffff 0%, #f5fffd 100%);
            box-shadow: 0 18px 48px rgba(15, 118, 110, 0.12);
            text-align: center;
        }

        .signin-card h2 {
            margin: 0;
            font-size: clamp(2rem, 4vw, 3.2rem);
            letter-spacing: -0.02em;
            color: #0f766e;
        }

        .signin-card p {
            max-width: 58ch;
            margin: 0.85rem auto 0;
            color: #475569;
            line-height: 1.65;
            font-size: 1.02rem;
        }

        .signin-actions {
            margin-top: 1.6rem;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.9rem;
        }

        .signin-actions a {
            min-width: 170px;
            padding: 0.95rem 1.2rem;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }

        .signin-actions a:hover {
            transform: translateY(-1px);
        }

        .signin-actions .primary-action {
            background: linear-gradient(135deg, #0f766e, #115e59);
            color: #ffffff;
            box-shadow: 0 14px 28px rgba(15, 118, 110, 0.24);
        }

        .signin-actions .primary-action:hover {
            box-shadow: 0 16px 32px rgba(15, 118, 110, 0.28);
        }

        .signin-actions .secondary-action {
            background: #ffffff;
            color: #0f766e;
            border: 1px solid #bfe6dc;
        }

        .signin-note {
            margin-top: 1.25rem;
            color: #64748b;
            font-size: 0.95rem;
        }

        @media (max-width: 640px) {
            .signin-card {
                padding: 1.5rem 1.1rem;
            }

            .signin-actions a {
                width: 100%;
                max-width: 320px;
            }
        }
    </style>
</head>

<body>
    <header class="site-header">
        <h1>Sign In</h1>
        <nav>
            <a href="/">Home</a>
        </nav>
    </header>

    <main class="signin-page">
        <section class="signin-card">
            <h2>Welcome back</h2>
            <p>
                Sign in to manage your profile, register organs, and check matches.
                If you do not have an account yet, create one to get started.
            </p>

            <div class="signin-actions" aria-label="Authentication actions">
                <a class="primary-action" href="/login_to_account">Sign In</a>
                <a class="secondary-action" href="/createaccount">Sign Up</a>
            </div>

            <div class="signin-note">Your account lets you see your dashboard and track your organ details in one place.</div>
        </section>
    </main>

    <footer>
        <small>&copy; <span id="year"></span> FindMyDoner</small>
    </footer>

    <script src="/js/main.js"></script>
</body>

</html>
