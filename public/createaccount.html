<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Create Account</title>
        <link rel="stylesheet" href="/css/styles.css" />
        <link rel="stylesheet" href="/css/createaccountstyle.css" />
    </head>
    <body>
        <header class="site-header">
            <h1>FindMyDonor</h1>
            <nav>
                <a href="/">Home</a>
                <a href="/login_to_account">Sign In</a>
                <a href="/contact">Contact</a>
            </nav>
        </header>

        <main class="container create-layout">
            <section class="card create-card">
                <h2>Create Account</p>
                <form id="createHealthReviewForm">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required />

                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required />

                    <label for="first_name">First Name</label>
                    <input type="text" id="first_name" name="first_name" required />

                    <label for="last_name">Last Name</label>
                    <input type="text" id="last_name" name="last_name" required />

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required />

                    <label for="phone_number">Phone Number</label>
                    <input type="text" id="phone_number" name="phone_number" required />

                    <label for="city">City</label>
                    <input type="text" id="city" name="city" required />

                    <label for="state">State</label>
                    <input type="text" id="state" name="state" required />

                    <label for="country">Country</label>
                    <input type="text" id="country" name="country" required />

                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" required />

                    <label for="height">Height (cm)</label>
                    <input type="number" id="height" name="height" required />

                    <label for="gender">Gender</label>
                    <input type="text" id="gender" name="gender" required />

                    <label for="blood_type">Blood Type</label>
                    <input type="text" id="blood_type" name="blood_type" required />

                    <label for="physical_report">Latest Physical Report</label>
                    <input type="file" id="physical_report" name="physical_report" accept=".pdf,image/*" required />

                    <div id="processing-status" class="processing-status" hidden aria-live="polite">
                        <div class="processing-heading">
                            <span class="processing-dot" aria-hidden="true"></span>
                            <strong id="processing-label">AI is processing your report</strong>
                        </div>
                        <p id="processing-text">Uploading and analyzing your physical report...</p>
                        <div class="processing-track" aria-hidden="true">
                            <div class="processing-fill"></div>
                        </div>
                        <div id="process-complete" class="process-complete" hidden>Process Complete</div>
                    </div>


                     <button type="button" id="start-health-review">Start AI Review</button>


                    <button type="submit">Create Account</button>
                </form>
                <small>Already have an account? <a href="/login_to_account">Sign in</a>.</small>
            </section>
        </main>

        <footer>
            <small>&copy; <span id="year"></span> FindMyDonor</small>
        </footer>
        <script src="/js/main.js"></script>
    </body>
</html>
