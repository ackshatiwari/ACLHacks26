<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Create Account</title>
        <link rel="stylesheet" href="/css/styles.css" />
        <link rel="stylesheet" href="/css/createaccountstyle.css" />
    </head>
    <body>
        <header class="site-header">
            <h1>Organ Transplant App</h1>
            <nav>
                <a href="/">Home</a>
                <a href="/login_to_account">Sign In</a>
                <a href="/contact">Contact</a>
            </nav>
        </header>

        <main class="container create-layout">
            <section class="card create-card">
                <h2>Create Your Account</h2>
                <p>Set up your profile to start donor registration and matching steps.</p>
                <form id="createAccountForm" action="/api/createaccount" method="POST">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required />

                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required />

                    <label for="first_name">First Name</label>
                    <input type="text" id="first_name" name="first_name" required />

                    <label for="last_name">Last Name</label>
                    <input type="text" id="last_name" name="last_name" required />

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required />

                    <label for="phone_number">Phone Number</label>
                    <input type="text" id="phone_number" name="phone_number" required />

                    <label for="city">City</label>
                    <input type="text" id="city" name="city" required />

                    <label for="state">State</label>
                    <input type="text" id="state" name="state" required />

                    <label for="country">Country</label>
                    <input type="text" id="country" name="country" required />

                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" required />

                    <label for="height">Height (cm)</label>
                    <input type="number" id="height" name="height" required />

                    <label for="gender">Gender</label>
                    <input type="text" id="gender" name="gender" required />

                    <label for="blood_type">Blood Type</label>
                    <input type="text" id="blood_type" name="blood_type" required />


                    

                    <button type="submit">Create Account</button>
                </form>
                <small>Already have an account? <a href="/login_to_account">Sign in</a>.</small>
            </section>
        </main>

        <footer>
            <small>&copy; <span id="year"></span> Organ Transplant App</small>
        </footer>
        <script src="/js/main.js"></script>
    </body>
</html>
