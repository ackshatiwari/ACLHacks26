<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Match with Donor</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
        .match-page {
            max-width: 1180px;
            margin: 0 auto;
            padding: 1.5rem 1rem 3rem;
        }

        .match-hero {
            display: grid;
            gap: 1rem;
            padding: 1.6rem;
            border-radius: 24px;
            border: 1px solid #d8eee7;
            background:
                radial-gradient(circle at 8% 14%, rgba(15, 118, 110, 0.16), transparent 34%),
                radial-gradient(circle at 92% 76%, rgba(45, 212, 191, 0.14), transparent 32%),
                linear-gradient(150deg, #ffffff 0%, #f5fffd 100%);
            box-shadow: 0 18px 50px rgba(15, 118, 110, 0.12);
        }

        .match-kicker {
            display: inline-flex;
            align-items: center;
            width: fit-content;
            padding: 0.4rem 0.8rem;
            border-radius: 999px;
            background: #eafbf6;
            color: #0f766e;
            font-weight: 700;
            font-size: 0.88rem;
            letter-spacing: 0.02em;
        }

        .match-hero h2 {
            margin: 0;
            font-size: clamp(2rem, 4.5vw, 3.5rem);
            letter-spacing: -0.03em;
            color: #0f172a;
            line-height: 1.02;
        }

        .match-hero p {
            margin: 0;
            max-width: 70ch;
            color: #475569;
            line-height: 1.65;
            font-size: 1.03rem;
        }

        .match-layout {
            display: grid;
            grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
            gap: 1rem;
            margin-top: 1rem;
            align-items: start;
        }

        .match-panel,
        .match-results {
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid #dfeae5;
            border-radius: 22px;
            box-shadow: 0 12px 36px rgba(15, 23, 42, 0.08);
            overflow: hidden;
        }

        .panel-head {
            padding: 1rem 1.1rem;
            border-bottom: 1px solid #e7efea;
            background: linear-gradient(135deg, #effaf7 0%, #ffffff 82%);
        }

        .panel-head h3 {
            margin: 0;
            font-size: 1.08rem;
            color: #0f172a;
        }

        .panel-body {
            padding: 1.1rem;
        }

        .organ-form {
            display: grid;
            gap: 0.8rem;
        }

        .organ-form label {
            font-size: 0.92rem;
            font-weight: 700;
            color: #334155;
        }

        .organ-form select {
            width: 100%;
            border-radius: 14px;
            border: 1px solid #cbd5e1;
            padding: 0.85rem 0.95rem;
            background: #fff;
            font-size: 1rem;
        }

        .organ-form select:focus {
            outline: none;
            border-color: #0f766e;
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14);
        }

        .organ-form button {
            margin-top: 0.2rem;
            border: 0;
            border-radius: 14px;
            padding: 0.9rem 1rem;
            background: linear-gradient(135deg, #0f766e, #115e59);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 14px 28px rgba(15, 118, 110, 0.2);
        }

        .organ-form button:hover {
            transform: translateY(-1px);
            box-shadow: 0 16px 32px rgba(15, 118, 110, 0.24);
        }

        .hint-list {
            margin: 0.95rem 0 0;
            padding-left: 1rem;
            color: #4b5563;
            line-height: 1.6;
        }

        .hint-list li {
            margin-bottom: 0.35rem;
        }

        #matches-container {
            padding: 1.1rem;
        }

        .empty-state,
        .results-state {
            margin: 0;
            padding: 1rem 1.1rem;
            border-radius: 16px;
            border: 1px dashed #bfdad2;
            background: #f4fbf8;
            color: #4b5563;
            line-height: 1.6;
        }

        .results-state h3 {
            margin: 0 0 0.5rem;
            color: #0f172a;
        }

        .results-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 0.8rem;
        }

        .result-pill {
            display: inline-flex;
            align-items: center;
            padding: 0.35rem 0.7rem;
            border-radius: 999px;
            background: #eafbf6;
            color: #0f766e;
            font-size: 0.85rem;
            font-weight: 700;
        }

        @media (max-width: 900px) {
            .match-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header class="site-header">
        <h1>Match with Donor</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/dashboard">Dashboard</a>
            <a href="/registerorgans">Register Organ</a>
        </nav>
    </header>

    <main class="match-page">
        <section class="match-hero">
            <span class="match-kicker">Donor matching</span>
            <h2>Find compatible donors</h2>
            <p>Select an organ to find matches</p>
        </section>

        <section class="match-layout">
            <aside class="match-panel">
                <div class="panel-head">
                    <h3>Search Filters</h3>
                </div>
                <div class="panel-body">
                    <form id="match-with-donor-form" class="organ-form" onsubmit="return false;">
                        <label for="match-organ">Organ Needed</label>
                        <select id="match-organ" name="organ" required>
                            <option value="">Select an organ</option>
                            <option value="kidney">Kidney</option>
                            <option value="liver">Liver</option>
                            <option value="lung">Lung</option>
                            <option value="heart">Heart</option>
                        </select>

                        <button type="submit">Find Matches</button>
                    </form>

                    <ul class="hint-list">
                        <li>Kidney: HLA matching</li>
                        <li>Lung: pTLC matching</li>
                        <li>Results show donor info and organ data</li>
                    </ul>
                </div>
            </aside>

            <section class="match-results" aria-live="polite">
                <div class="panel-head">
                    <h3>Results</h3>
                </div>
                <div id="matches-container">
                    <div class="empty-state">Select an organ to see results</div>
                </div>
            </section>
        </section>
    </main>

    <script src="/js/main.js"></script>
</body>

</html>
